manifest_version: 4
status: approved_for_implementation
runtime_usage: design_time_only
illustrated_weapon_count: 10
license: MIT
copyright: "2026 SvSam"

target:
  terraria: 1.4.4.9
  tmodloader: 2026.06
  dotnet: 8
  csharp: 12
  multiplayer: [single_player, host_and_play, dedicated_server]

global:
  damage_class: MeleeNoSpeed
  item_size_pixels: [40, 40]
  use_animation_matches_use_time: true
  embedded_cap_per_owner_per_npc: 8
  standard_embedded_duration_ticks: 240
  flight_timeout_ticks: 600
  trail_cache_length: 8
  maximum_trail_gap_pixels: 160
  crit_policy: "Direct hits may crit except Gold Spear; bursts, saw pulses, debuff-only attacks, and Monarch volley components cannot crit."
  timer_policy: "Gameplay timers advance once per game tick, independently of projectile extraUpdates."
  authority: "Owning clients spawn and steer projectile volleys; servers own NPC debuffs, Gold Curse rewards, and Thorned cooldowns."
  embedded_eviction: "The ninth attached spear evicts the oldest; Gemini damage spears explode while debuff spears and saws disappear."

projectile_contract:
  hitbox_pixels: [16, 16]
  tile_collision_hitbox_pixels: [10, 10]
  extra_updates: 1
  ignores_water: true
  states: [Flying, Lodged, Penetrating, Overshooting, Returning, Sawing, Terminal]
  synchronized_fields:
    - attack_kind
    - state
    - target_index
    - state_timer
    - source_flags
    - impact_direction
    - lodged_offset
    - state_origin
  trail_rules:
    - initialize_history_on_spawn_and_state_change
    - reject_zero_or_non_finite_history
    - reject_gaps_over_160_pixels
    - subtract_screen_position_exactly_once

custom_effects:
  gold_curse:
    duration_ticks: 300
    eligible: "Hostile non-boss NPCs with a positive coin value."
    weighted_bonus_percent:
      25: 50
      50: 30
      75: 15
      100: 5
    refresh: "Refresh duration without rerolling while active."
    reward: "On server-side NPC death, drop NPC.value multiplied by the rolled bonus exactly once."
  thorned:
    duration_ticks: 180
    cooldown_ticks_per_npc: 1800
    behavior: "Suppress eligible NPC AI, velocity, contact damage, and new attacks; tint green-brown."
    excluded: [boss_or_boss_counted, friendly_or_town_npc, segmented_npc, zero_knockback_resistance, unchaseable_target]
    resisted_behavior: "Poisoned still applies; Thorned does not."

weapons:
  - slot: pre_boss
    internal_name: GoldSpear
    display_name: Gold Spear
    balance: { base_damage: 18, use_time_ticks: 28, use_animation_ticks: 28, shoot_speed_raw: 5.0, knockback: 5.0, armor_penetration: 0, extra_crit: 0 }
    acquisition: { type: recipe, ingredients: ["10 Gold Bars", "5 Wood"], station: Work Bench }
    attack:
      components: [{ kind: Gold, damage_multiplier: 1.0 }]
      behavior: "Contact once, apply Gold Curse when eligible, then disappear; never lodge or explode."
    art: { item_png: Content/Items/Weapons/Spears/GoldSpear.png, projectile_texture: item_png }

  - slot: post_eater_of_worlds
    internal_name: NightsSpine
    display_name: Post-Eater of Worlds Spear
    balance: { base_damage: 36, use_time_ticks: 25, use_animation_ticks: 25, shoot_speed_raw: 5.5, knockback: 5.5, armor_penetration: 0, extra_crit: 0 }
    acquisition: { type: recipe, predecessor: GoldSpear, boss_condition: downed_eater_of_worlds }
    attack:
      components: [{ kind: Corruption, damage_multiplier: 1.0 }]
      behavior: "Contact once, lodge for 240 ticks, maintain Shadowflame while lodged and for 120 ticks afterward, then disappear without exploding."
    art: { item_png: Content/Items/Weapons/Spears/NightsSpine.png, projectile_texture: item_png }

  - slot: post_brain_of_cthulhu
    internal_name: BloodSpine
    display_name: Bloodspine
    balance: { base_damage: 36, use_time_ticks: 25, use_animation_ticks: 25, shoot_speed_raw: 5.5, knockback: 5.5, armor_penetration: 0, extra_crit: 0 }
    acquisition: { type: recipe, predecessor: GoldSpear, boss_condition: downed_brain_of_cthulhu }
    attack:
      components: [{ kind: Crimson, damage_multiplier: 1.0 }]
      behavior: "Contact once, lodge for 240 ticks, maintain Ichor while lodged and for 120 ticks afterward, then disappear without exploding."
    art: { item_png: Content/Items/Weapons/Spears/BloodSpine.png, projectile_texture: item_png }

  - slot: post_wall_of_flesh
    internal_name: Hellrend
    display_name: Hellrend
    balance: { base_damage: 60, use_time_ticks: 24, use_animation_ticks: 24, shoot_speed_raw: 6.0, knockback: 6.0, armor_penetration: 0, extra_crit: 0 }
    acquisition: { type: guaranteed_boss_drop, source: Wall of Flesh, all_difficulties: true }
    attack:
      spread_degrees: [-24, 0, 24]
      side_offsets_pixels: [-12, 12]
      component_damage_multipliers: [0.65, 1.0, 0.65]
      explosion: { damage_multiplier: 0.75, radius_pixels: 48, triggers: [npc, tile], can_crit: false }
      debuff: { name: Hellfire, duration_ticks: 180, direct_npc_contact_only: true }
    art: { item_png: Content/Items/Weapons/Spears/Hellrend.png, projectile_texture: item_png }

  - slot: post_destroyer
    internal_name: Mightpiercer
    display_name: Mightpiercer
    balance: { base_damage: 88, use_time_ticks: 22, use_animation_ticks: 22, shoot_speed_raw: 7.0, knockback: 6.25, armor_penetration: 8, extra_crit: 0 }
    acquisition: { type: recipe, predecessor: Hellrend, boss_condition: DownedDestroyer }
    attack:
      target_range_pixels: 800
      first_hit_damage_multiplier: 1.0
      overshoot_distance_pixels: 96
      return_hit_damage_multiplier: 1.25
      return_turn_rate_degrees_per_tick: 12
      behavior: "Lock one target, suppress damage while penetrating and overshooting, hit that same target on return, then disappear."
    art: { item_png: Content/Items/Weapons/Spears/Mightpiercer.png, projectile_texture: item_png }

  - slot: post_twins
    internal_name: GeminiGaze
    display_name: Post-Twins Spear
    balance: { base_damage: 108, use_time_ticks: 21, use_animation_ticks: 21, shoot_speed_raw: 7.5, knockback: 6.5, armor_penetration: 8, extra_crit: 0 }
    acquisition: { type: recipe, predecessor: Mightpiercer, boss_condition: DownedTwins }
    attack:
      shared_target_range_pixels: 800
      components:
        - { kind: GeminiInferno, health_damage: 0, debuff: Cursed Inferno, debuff_duration_ticks: 240, terminal: disappear_on_contact }
        - { kind: GeminiDamage, damage_multiplier: 1.0, lodged_duration_ticks: 240, explosion_damage_multiplier: 0.85, explosion_radius_pixels: 56, tile_explodes: true }
    art: { item_png: Content/Items/Weapons/Spears/GeminiGaze.png, projectile_texture: item_png }

  - slot: post_skeletron_prime
    internal_name: Frightsteel
    display_name: Post-Skeletron Prime Spear
    balance: { base_damage: 132, use_time_ticks: 20, use_animation_ticks: 20, shoot_speed_raw: 8.0, knockback: 7.0, armor_penetration: 12, extra_crit: 0 }
    acquisition: { type: recipe, predecessor: GeminiGaze, boss_condition: DownedSkeletronPrime }
    attack:
      shared_target_range_pixels: 800
      components:
        - { kind: FrightDestroyer, first_hit_damage_multiplier: 0.65, return_hit_damage_multiplier: 0.8, overshoot_distance_pixels: 96 }
        - { kind: FrightInferno, health_damage: 0, debuff: Cursed Inferno, debuff_duration_ticks: 240 }
        - { kind: PrimeSaw, impact_damage_multiplier: 0.75, lodged_duration_ticks: 240, pulse_interval_ticks: 30, pulse_count: 8, pulse_damage_multiplier: 0.15, debuff: Bleeding, debuff_duration_ticks: 600, explodes: false }
    art: { item_png: Content/Items/Weapons/Spears/Frightsteel.png, projectile_texture: item_png }

  - slot: post_plantera
    internal_name: FlowerSpike
    display_name: FlowerSpike
    balance: { base_damage: 150, use_time_ticks: 19, use_animation_ticks: 19, shoot_speed_raw: 8.5, knockback: 6.75, armor_penetration: 10, extra_crit: 0 }
    acquisition: { type: recipe, predecessor: Frightsteel, boss_condition: DownedPlantera }
    attack:
      primary: { damage_multiplier: 1.0, lodged_duration_ticks: 240, debuff: Venom, residual_debuff_ticks: 120, explodes: false }
      alternate: { health_damage: 0, debuff: Poisoned, debuff_duration_ticks: 480, crowd_control: Thorned }
    art: { item_png: Content/Items/Weapons/Spears/FlowerSpike.png, projectile_texture: item_png }

  - slot: post_golem
    internal_name: Tepoztopilli
    display_name: Tepoztopilli
    balance: { base_damage: 170, use_time_ticks: 18, use_animation_ticks: 18, shoot_speed_raw: 9.0, knockback: 7.25, armor_penetration: 20, extra_crit: 0 }
    acquisition: { type: recipe, predecessor: FlowerSpike, boss_condition: DownedGolem }
    attack:
      components: [{ kind: Tepoztopilli, damage_multiplier: 1.0 }]
      explosion: { damage_multiplier: 0.8, radius_pixels: 72, triggers: [npc, tile], can_crit: false }
      debuff: { name: On Fire!, duration_ticks: 480, direct_npc_contact_only: true }
    art: { item_png: Content/Items/Weapons/Spears/Tepoztopilli.png, projectile_texture: item_png }

  - slot: post_moon_lord
    internal_name: MonarchsSpear
    display_name: Monarch's Spear
    balance: { base_damage: 500, use_time_ticks: 16, use_animation_ticks: 16, shoot_speed_raw: 10.0, knockback: 8.0, armor_penetration: 30, extra_crit: 10 }
    acquisition: { type: recipe, complete_progression_recipe: true, boss_condition: DownedMoonLord }
    attack:
      combo: "Uses one through five launch a volley; use six launches the final spear and resets."
      volley:
        component_damage_multiplier: 0.2
        homing_range_pixels: 1000
        homing_speed_pixels_per_tick: 16
        homing_turn_rate_degrees_per_tick: 10
        components: [Gold, Corruption, Crimson, Hellrend, Mightpiercer, GeminiInferno, GeminiDamage, PrimeSaw, FlowerPrimary, Tepoztopilli]
        recursion: forbidden
      final:
        damage: 500
        scale: 1.65
        homing_range_pixels: 1200
        homing_speed_pixels_per_tick: 16
        homing_turn_rate_degrees_per_tick: 12
        tile_collision: false
        penetration: 1
      reset_conditions: [sixth_use, death, disconnect, held_item_change]
    art: { item_png: Content/Items/Weapons/Spears/MonarchsSpear.png, projectile_texture: item_png }

validation:
  build: { warnings_allowed: 0, target_framework: net8.0, language_version: 12 }
  progression: { preserve_recipes: true, preserve_internal_names: true, preserve_assets: true }
  combat:
    - exact_projectile_counts_and_multipliers
    - mightpiercer_exactly_two_hits
    - prime_saw_exactly_eight_pulses
    - ninth_embed_deterministic_eviction
    - gold_curse_single_server_reward
    - thorned_duration_cooldown_and_immunities
    - monarch_five_volleys_then_final
    - no_recursive_monarch_components
    - no_screen_spanning_trails
  multiplayer: [single_player, host_and_play, dedicated_server, late_join, owner_disconnect]
