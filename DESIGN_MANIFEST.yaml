manifest_version: 3
status: approved_for_implementation
runtime_usage: design_time_only
illustrated_weapon_count: 10
unillustrated_entries: void
license: MIT
copyright: "2026 SvSam"

target:
  terraria: 1.4.4.9
  tmodloader: 2026.06
  dotnet: 8
  csharp: 12
  multiplayer: [single_player, host_and_play, dedicated_server]

global:
  progression_family_cap_per_owner_per_npc: 8
  embedded_duration_seconds: 5
  fixed_dot_ignores_defense: true
  fixed_dot_life_regen_rule: "Subtract twice the summed fixed DPS from NPC life regeneration."
  crit_policy: "Direct main-spear hits may crit except Gold Spear; fixed DoT, bursts, orbitals, copies, and auxiliary projectiles cannot crit."
  pvp: unsupported
  item_size_pixels: [40, 40]
  damage_class: MeleeNoSpeed
  item_use_style: Swing
  no_melee: true
  no_use_graphic: true
  auto_reuse: true
  use_sound: SoundID.Item1
  research_unlock_count: 1
  item_set: ItemID.Sets.Spears
  use_animation_policy: "useAnimation always equals useTime; one throw or volley per use."
  melee_speed_policy: "Melee-speed bonuses affect projectile velocity, not firing cadence."

main_projectile:
  implementation: "One shared dynamic ModProjectile drawing the selected weapon's item icon."
  hitbox_pixels: [16, 16]
  tile_collision_hitbox_pixels: [10, 10]
  extra_updates: 1
  updates_per_tick: 2
  ignores_water: true
  max_flight_updates: 3600
  max_flight_seconds: 30
  gravity_delay_updates: 45
  gravity_delay_seconds: 0.375
  horizontal_drag_per_update: 0.995
  gravity_per_update: 0.15
  custom_fall_speed_cap: none
  fade_in: true
  rotation: velocity_aligned
  trail: "Short color-matched projectile afterimages."
  ai_contract:
    ai_0: SpearKind
    ai_1: "state plus embedded target identifier"
    ai_2: state_timer
    extra_ai:
      - embedded_target_offset
      - original_flight_direction
      - gemini_mode
      - monarch_identity
      - source_flags
  states:
    flying:
      contact_damage: true
      tile_collision: true
    embedded:
      contact_damage: false
      tile_collision: false
      duration_updates: 600
      behavior: "Follow the target at a stored target-relative offset."
    detonating:
      behavior: "Transition exactly once, spawn the configured burst and children, then die."
  embed_cap:
    scope: "Same NPC, same projectile owner, all ten progression weapons."
    eviction: "When a ninth spear attaches, detonate the oldest."
    multiplayer: "Each player owns an independent cap; fixed DoT from different players stacks."
  detonation_triggers:
    - tile_collision
    - flight_timeout
    - embedded_expiry
    - embedded_target_death_or_despawn
    - oldest_cap_eviction
  burst_rules:
    invisible_circular_hitbox: true
    hits_each_npc_once: true
    passes_through_walls: true
    can_crit: false
  source_flags:
    main: "May embed, detonate, apply debuffs, and create configured children."
    hellrend_side: "May embed and detonate; may not recursively create another volley."
    monarch_orbital: "One hit; no crit, debuff, embed, burst, or children."
    monarch_copy: "One hit; no crit, debuff, embed, burst, or children."
    auxiliary: "No crit, embed, burst, or recursive children unless explicitly stated."

networking:
  item_volleys_and_children: "Spawn once from the owning client and synchronize."
  authoritative_state:
    - npc_life_and_life_regen
    - npc_crowd_control
    - world_progression_flags
    - boss_loot
  deterministic_selection:
    target_order: "Shortest distance, then lowest NPC index."
    requires_line_of_sight_on_acquisition: true
    monarch_identity_and_mode: "Chosen once by the owner/server-authoritative state and synchronized."
  late_join: "Reconstruct embedded registrations during projectile AI."
  state_transitions: "Set netUpdate whenever flight, embed, mode, identity, or detonation state changes."

world_progression:
  custom_saved_and_synced_flags:
    downed_eater_of_worlds:
      condition_key: Mods.Spears.Conditions.DownedEaterOfWorlds
      completion: "After an Eater segment dies, scan on the next tick and set only if no Eater head, body, or tail remains."
    downed_brain_of_cthulhu:
      condition_key: Mods.Spears.Conditions.DownedBrainOfCthulhu
      completion: "Set when the Brain of Cthulhu dies."
  vanilla_dedicated_flags:
    - DownedDestroyer
    - DownedTwins
    - DownedSkeletronPrime
    - DownedPlantera
    - DownedGolem
    - DownedMoonLord

crowd_control:
  eligibility:
    excluded:
      - boss_or_boss_counted
      - friendly_or_town_npc
      - segmented_npc
      - zero_knockback_resistance
      - unchaseable_target
  stunned:
    duration_seconds: 3
    behavior: "Suppress eligible NPC AI and set velocity to zero."
    resisted_behavior: "Ineligible targets take projectile damage but are not stunned."
    runtime_icon: Webbed
  the_kings_of_kings:
    duration_seconds: 5
    behavior:
      ground: "After ordinary AI, accelerate away from the nearest player up to 4 pixels/tick and jump when blocked."
      flying: "After ordinary AI, steer away from the nearest player up to 6 pixels/tick."
    resisted_behavior: "Ineligible targets take burst damage but do not flee."
    runtime_icon: Confused

secondary_projectiles:
  ShadowThorn:
    size_pixels: [12, 12]
    speed: 14
    lifetime_ticks: 60
    tile_collision: false
    target_range_pixels: 240
    turn_rate_degrees_per_tick: 12
    penetration: 1
    on_hit: "Apply Stunned for 3 seconds to eligible enemies."
    visual: procedural
  BloodNeedle:
    size_pixels: [8, 8]
    speed: 10
    lifetime_ticks: 45
    tile_collision: true
    launch_angles_degrees: [-30, -10, 10, 30]
    penetration: 1
    visual: procedural
  MightArc:
    target_count: 2
    target_range_pixels: 180
    distinct_targets: true
    collision: "One-tick target-specific line collision."
    penetration: 1
    visual: procedural
  RetinazerBeam:
    size_pixels: [8, 8]
    speed: 24
    lifetime_ticks: 30
    tile_collision: true
    direction: stored_impact_direction
    penetration: 1
    visual: procedural
  SpazmatismFlare:
    size_pixels: [24, 24]
    speed: 12
    lifetime_ticks: 45
    tile_collision: true
    penetration: 1
    on_hit: "Apply Cursed Inferno for 4 seconds."
    visual: procedural
  PrimeBlade:
    size_pixels: [14, 14]
    speed: 10
    lifetime_ticks: 60
    tile_collision: true
    launch_pattern: "Four evenly spaced directions."
    rotation_radians_per_tick: 0.4
    penetration: 1
    visual: procedural
  SeekingPetal:
    size_pixels: [10, 10]
    speed: 8
    lifetime_ticks: 90
    tile_collision: true
    launch_fan_degrees: [-50, -30, -10, 10, 30, 50]
    outward_phase_ticks: 12
    target_range_pixels: 500
    turn_rate_degrees_per_tick: 10
    prefer_distinct_targets: true
    penetration: 1
    visual: procedural
  TempleShard:
    size_pixels: [12, 12]
    speed: 10
    lifetime_ticks: 60
    launch_pattern: "Six evenly spaced radial directions."
    ignore_tiles_ticks: 12
    penetration: 1
    visual: procedural

weapons:
  - slot: pre_boss
    internal_name: GoldSpear
    display_name: Gold Spear
    tooltip: "Trusty spear smeared with gold."
    theme_summary: "A golden javelin that embeds in enemies and may inflict Midas."
    balance:
      base_damage: 15
      use_time_ticks: 32
      use_animation_ticks: 32
      knockback: 5.0
      extra_crit: 0
      armor_penetration: 0
      shoot_speed_raw: 5.0
      shoot_speed_effective: 10.0
      rarity: ItemRarityID.White
      sell_value: "2 Silver"
      benchmark: "Pre-boss single-target melee weapon."
    acquisition:
      type: recipe
      ingredients:
        - { item: Gold Bar, quantity: 10 }
        - { item: Wood, quantity: 5 }
      crafting_station: Work Bench
      boss_condition: none
    impact:
      damage_multiplier: 1.0
      can_crit: false
      debuffs:
        - { name: Midas, chance_percent: 50, duration_seconds: 5 }
    embedded:
